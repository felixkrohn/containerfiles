# Container configuration for pi-code with buildah/podman support
# Based on upstream buildah containers pattern, adapted for rootless operation

[containers]
# Network namespace - use host networking by default (can be overridden per-container)
netns = "host"

# User namespace settings  
userns = "keep-id"

# IPC and UTS namespaces
ipcns = "private"
utsns = "private"

# Cgroup namespace - inherit from host for better resource management
cgroupns = "host"

[cgroups]
# Use systemd as cgroup manager when available, fall back to cgroupfs
manager = "systemd"

[network]
# Network backend - netavark is the modern default for podman
network_backend = "netavark"

[engine]
# Cgroup manager for container processes  
cgroup_manager = "cgroupfs"

# Event logging to file
events_logger = "file"

# OCI runtime - use crun (faster, better rootless support)
runtime = "crun"

# Disable machine commands (not relevant in this context)
machine_enabled = false

[images]
# Default format for pulling images
format = "oci"

# Signature policy location
policy_path = "/etc/containers/policy.json"

[secrets]
# Location for secrets storage
driver = "file"
